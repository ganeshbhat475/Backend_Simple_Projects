<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat App</title>
    <link rel="icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="chat">
        <aside id="sidebar" class="chat__sidebar" aria-label="Room members"></aside>
        <div class="chat__main">
            <div id="connection-status" class="connection-status" role="status" aria-live="polite">Connecting…</div>
            <div id="messages" class="chat__messages" aria-live="polite" aria-label="Chat messages"></div>
            <p id="chat-error" class="chat-error" role="alert" hidden></p>

            <div class="compose">
                <form id="message-form">
                    <label class="visually-hidden" for="message-input">Message</label>
                    <input id="message-input" name="message" placeholder="Write a message…" maxlength="1000" required autocomplete="off">
                    <button type="submit">Send</button>
                </form>
                <button id="send-location" type="button">Share location</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO serves the matching browser client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
</body>

</html>
